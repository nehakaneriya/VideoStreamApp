# ============================================================
# VideoStreamApp Frontend — Nginx config
# SPA routing + backend API/OAuth2 reverse proxy
# ============================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Large video uploads
    client_max_body_size 500M;

    # ── React Router SPA fallback ──────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ──────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:2911/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # ── OAuth2 login/redirect proxy ─────────────────────────────
    location /oauth2/ {
        proxy_pass http://backend:2911/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:2911/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
